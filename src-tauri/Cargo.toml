[package]
name = "knowtrace"
version = "0.2.4"
description = "KnowTrace · 知迹，本地项目记忆工作台"
authors = ["KnowTrace"]
edition = "2021"
default-run = "knowtrace"

[lib]
name = "knowtrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
keyring = "4.2"
ring = "0.17"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
pulldown-cmark = "0.13"
dirs = "7"

[dev-dependencies]
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
