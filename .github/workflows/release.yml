name: Release KnowTrace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag matching the project version
        required: true
        default: v0.2.7
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.releaseTag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.releaseTag || github.ref_name }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, tomllib
          package = json.loads(pathlib.Path('package.json').read_text())
          tauri = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())
          cargo = tomllib.loads(pathlib.Path('src-tauri/Cargo.toml').read_text())
          lock = tomllib.loads(pathlib.Path('src-tauri/Cargo.lock').read_text())
          locked = next(item['version'] for item in lock['package'] if item['name'] == 'knowtrace')
          version = package['version']
          assert version == tauri['version'] == cargo['package']['version'] == locked, 'Project versions disagree'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match the project version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag=v{version}\n')
          PY

  build:
    needs: version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check graph behavior
        run: pnpm test:graph
      - name: Check archive sidebar behavior
        run: pnpm test:archive-sidebar
      - name: Check model service configuration
        run: pnpm test:model-services
      - name: Check Harness and settings UI behavior
        run: pnpm test:harness-ui
      - name: Check official usage price rules
        run: pnpm test:usage-prices
      - name: Test storage and built-in MCP
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib --bin knowtrace
      - name: Configure macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Build installer
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadUpdaterJson: false
      - name: Collect release files
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { copyFileSync, mkdirSync } from 'node:fs';
          import { basename, join } from 'node:path';
          mkdirSync('release-assets');
          const installers = JSON.parse(process.env.ARTIFACT_PATHS).filter(path => /\.(dmg|exe)$/.test(path));
          assert.equal(installers.length, 1, 'Expected one installer for this target');
          for (const path of installers) copyFileSync(path, join('release-assets', basename(path)));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish application installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 本次更新

          - 工作台、归档用量、设置和浮层采用玻璃拟态。正文、编辑区和数据表格使用实色底。新增浅色默认预设，石墨夜色同步更新，已保存的主题配置继续加载。
          - 页面切换轻淡入，窄窗口侧栏滑入滑出，弹窗、菜单和按钮提供短动效。动效跟随系统的「减少动态效果」设置。
          - 搜索时显示进度提示。可用上下方向键浏览结果，按 Enter 打开记忆。窄窗口返回列表时保留滚动位置和选中条目的键盘焦点。
          - Esc 可关闭菜单、仓库弹窗与窄窗口侧栏。关闭仓库弹窗后，键盘焦点回到打开弹窗的控件。
          - 升级沿用原有记忆库、模型配置和归档进度。

          仅提供 macOS arm64、macOS Intel x64 与 Windows x64 三个平台应用安装包，MCP 已内置于应用。

          macOS 安装包使用临时签名，未经 Apple 公证。Windows 安装包未签名。

          在应用的「MCP 接入」页启动 HTTP 服务并复制地址即可接入。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "知迹 KnowTrace $RELEASE_VERSION" --notes-file release-notes.md --draft=false
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "知迹 KnowTrace $RELEASE_VERSION" --notes-file release-notes.md
          fi
